[project]
name = "ci-dashboard"
version = "1.0.0"
description = "Static CI-health (flaky rate) and release-provenance dashboard for GitHub repositories, published to GitHub Pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.0",
    "pyyaml>=5.4",
]

[project.scripts]
ci-dashboard = "ci_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_dashboard"]
