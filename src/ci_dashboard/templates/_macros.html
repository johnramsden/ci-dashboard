{% macro breadcrumbs(items) %}<section class="p-strip is-shallow u-no-padding--bottom">
<div class="row">
<nav class="p-breadcrumbs" aria-label="Breadcrumbs"><ol class="p-breadcrumbs__items">{% for label, href in items %}{% if href %}<li class="p-breadcrumbs__item"><a href="{{ href }}">{{ label }}</a></li>{% else %}<li class="p-breadcrumbs__item">{{ label }}</li>{% endif %}{% endfor %}</ol></nav>
</div>
</section>
{% endmacro %}

{% macro notification() %}<div class="p-notification--information">
<div class="p-notification__content">
<p class="p-notification__message">{{ caller() }}</p>
</div>
</div>
{% endmacro %}
