{% extends "base.html" %}
{% block content %}<section class="p-strip">
<div class="row">
<h1 class="p-heading--2">{{ site_title }}</h1>
<p>{{ site_description }}</p>
</div>
<div class="row">
{% for section in sections %}<div class="col-4">
<div class="p-card">
<h3 class="p-card__title"><a href="{{ section.href }}">{{ section.title }}</a></h3>
<p>{{ section.description }}</p>
</div>
</div>
{% endfor %}</div>
</section>
{% endblock %}
